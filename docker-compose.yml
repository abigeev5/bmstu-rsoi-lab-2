version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      # Over TCP on purpose: while the init scripts run, the server listens on the unix socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "program", "-d", "reservations"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway-service:
    build:
      context: .
      args:
        SERVICE: gateway-service
    image: gateway-service
    container_name: gateway-service
    environment:
      RESERVATION_URL: http://reservation-service:8070
      PAYMENT_URL: http://payment-service:8060
      LOYALTY_URL: http://loyalty-service:8050
    depends_on:
      - reservation-service
      - payment-service
      - loyalty-service
    ports:
      - "8080:8080"

  reservation-service:
    build:
      context: .
      args:
        SERVICE: reservation-service
    image: reservation-service
    container_name: reservation-service
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/reservations
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8070:8070"

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    image: payment-service
    container_name: payment-service
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8060:8060"

  loyalty-service:
    build:
      context: .
      args:
        SERVICE: loyalty-service
    image: loyalty-service
    container_name: loyalty-service
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/loyalties
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8050"

volumes:
  db-data:
