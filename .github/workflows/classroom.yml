name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          # The runner has the PGDG repo with a newer libpq; userver needs libpq to match
          # postgresql-server-dev-16 from Ubuntu, as in WSL and in the Docker image.
          printf 'Package: libpq5 libpq-dev\nPin: release o=Ubuntu\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/libpq-ubuntu
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades --no-install-recommends $(cat deps/ubuntu-24.04.txt)

      - name: Check formatting
        run: clang-format-20 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: Cache userver sources and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/CPM
            ~/.cache/ccache
          key: build-${{ hashFiles('CMakeLists.txt', 'deps/ubuntu-24.04.txt') }}-${{ github.run_number }}
          restore-keys: |
            build-${{ hashFiles('CMakeLists.txt', 'deps/ubuntu-24.04.txt') }}-
            build-

      - name: Build (with clang-tidy)
        run: |
          ccache -M 5G
          cmake --preset debug
          cmake --build --preset debug
          ccache -s

      - name: Run unit tests
        run: ctest --preset debug

      - name: Build release binaries
        run: |
          cmake --preset release
          cmake --build --preset release \
            --target gateway-service reservation-service payment-service loyalty-service
          ccache -s

      # The images only package the release binaries built above (see Dockerfile)
      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v2/postman/collection.json
          environment: v2/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Show service logs
        if: failure()
        run: docker compose logs

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
