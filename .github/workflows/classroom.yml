name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        run: |
          # The runner has the PGDG repo with a newer libpq; userver needs libpq to match
          # postgresql-server-dev-16 from Ubuntu, as in WSL and in the Docker image.
          printf 'Package: libpq5 libpq-dev\nPin: release o=Ubuntu\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/libpq-ubuntu
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades --no-install-recommends $(cat deps/ubuntu-24.04.txt)

      - name: Check formatting
        run: clang-format-20 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: Cache userver sources and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/CPM
            ~/.cache/ccache
          key: build-${{ hashFiles('CMakeLists.txt', 'deps/ubuntu-24.04.txt') }}-${{ github.run_number }}
          restore-keys: |
            build-${{ hashFiles('CMakeLists.txt', 'deps/ubuntu-24.04.txt') }}-
            build-

      # One build instead of debug + release: userver takes ~20 min per preset without a warm cache.
      # Sanitizers stay available locally via the `debug` preset.
      - name: Build (with clang-tidy)
        run: |
          ccache -M 5G
          cmake --preset release -DRSOI_CLANG_TIDY=ON
          cmake --build --preset release
          ccache -s

      - name: Run unit tests
        run: ctest --preset release

      # The images only package the release binaries built above (see Dockerfile)
      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v2/postman/collection.json
          environment: v2/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in gateway-service reservation-service payment-service loyalty-service; do
            for tag in latest "$GITHUB_SHA"; do
              docker tag "$service" "$registry/$service:$tag"
              docker push "$registry/$service:$tag"
            done
          done

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          HOOK_RESERVATION_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_RESERVATION }}
          HOOK_PAYMENT_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_PAYMENT }}
          HOOK_LOYALTY_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_LOYALTY }}
          HOOK_GATEWAY_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in reservation-service payment-service loyalty-service gateway-service; do
            var="HOOK_$(echo "${service//-/_}" | tr '[:lower:]' '[:upper:]')"
            hook="${!var}"
            if [ -z "$hook" ]; then
              echo "::warning::$var is not set, $service is not deployed"
              continue
            fi
            image=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))'               "$registry/$service:$GITHUB_SHA")
            curl -fsS -o /dev/null -X POST "$hook&imgURL=$image"
            echo "$service: deploy of $GITHUB_SHA started"
          done

      - name: Show service logs
        if: failure()
        run: docker compose logs

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
